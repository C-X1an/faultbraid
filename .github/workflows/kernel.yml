name: Kernel verification (not full release)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: .go-version
          cache: false
      - run: go version
      - run: make verify-seed
      - run: make fuzz mutation
      - run: make security-online
