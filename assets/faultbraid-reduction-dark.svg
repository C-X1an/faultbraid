<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">A FaultBraid unsafe-read counterexample, reduced from eleven actions to five</title>
<desc id="desc">A deliberately unsafe three-voter Raft scenario starts with eleven actions. After twenty-four executable reduction checks, it retains three directed partitions, a write of nine on node three, and an unsafe read on node two. The result remains INVALID. This is historical A7 evidence and one-minimal within the tested deletion domain.</desc>
