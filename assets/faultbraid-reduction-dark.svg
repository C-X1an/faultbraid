<linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5FE5F3"/><stop offset="1" stop-color="#FFAC8B"/></linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
